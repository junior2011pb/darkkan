name: Construir Executavel Windows

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller customtkinter supabase

      - name: Compilar com PyInstaller
        run: |
          pyinstaller --noconsole --onefile --name="Darkkan-Sistema-Windows" main.py

      - name: Guardar executavel como Artefacto
        uses: actions/upload-artifact@v4
        with:
          name: Darkkan-Sistema-Windows
          path: dist/Darkkan-Sistema-Windows.exe
